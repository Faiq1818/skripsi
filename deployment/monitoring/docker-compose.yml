services:
  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:v3.13.3-distroless
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus

networks:
  monitoring-network:
    driver: bridge

volumes:
  grafana-storage:
    driver: local
