services:
  mock-server:
    build:
      context: ../push_notification_mock_server
      dockerfile: Dockerfile
    container_name: push-notification-mock-server
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
    networks:
      - benchmark-network

  prometheus:
    image: prom/prometheus:v3.13.3-distroless
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - benchmark-network

  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - benchmark-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - benchmark-network

networks:
  benchmark-network:
    driver: bridge

volumes:
  grafana-storage:
    driver: local
