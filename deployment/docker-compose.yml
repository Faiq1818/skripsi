services:
  mock-server:
    build:
      context: ../push_notification_mock_server
      dockerfile: Dockerfile
    container_name: push-notification-mock-server
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - PORT=8080
    networks:
      - benchmark-network

  prometheus:
    image: prom/prometheus:v3.13.3-distroless
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - benchmark-network

  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - benchmark-network

networks:
  benchmark-network:
    driver: bridge

volumes:
  grafana-storage:
    driver: local
