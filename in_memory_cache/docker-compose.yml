services:
  redis:
    image: redis:8.8.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  asynqmon:
    image: hibiken/asynqmon:0.7.1
    container_name: asynqmon
    ports:
      - "8082:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
    depends_on:
      - redis
    networks:
      - app-network

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: in-memory-consumer
    environment:
      - REDIS_ADDR=redis:6379
      - MOCK_SERVER_URL=${MOCK_SERVER_URL:-http://host.docker.internal:8081}
      - CONSUMER_CONCURRENCY=${CONSUMER_CONCURRENCY:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
